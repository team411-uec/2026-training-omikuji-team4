<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
<   -->
    <style>
      body {
        margin: 24px;
        padding: 24px;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        line-height: 1.6;
        color: #3a2e2a;
        background: #fdf6e3;
      }

      h1 {
        text-align: center;
        color: #a83232;
        letter-spacing: 0.15em;
        margin-bottom: 8px;
      }

      h1::before,
      h1::after {
        content: "◆";
        font-size: 14px;
        color: #c9a15a;
        margin: 0 10px;
        vertical-align: middle;
      }

      p {
        text-align: center;
        color: #6b5a52;
      }

      .omikuji-result {
        max-width: 320px;
        margin: 24px auto;
        padding: 32px 136px;
        font-size: 30px;
        font-weight: bold;
        text-align: center;
        background: #fffaf0;
        color: #a83232;
        border: 2px solid #c9a15a;
        border-radius: 4px;
        box-shadow: 0 4px 12px rgba(168, 50, 50, 0.15);
        position: relative;
      }

      .omikuji-result::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid #c9a15a;
        border-radius: 2px;
        pointer-events: none;
      }

      .omikuji-controls {
        text-align: center;
      }

      .omikuji-controls button {
        margin: 0 8px;
        padding: 10px 24px;
        font-size: 16px;
        font-family: inherit;
        color: #fff;
        background: #a83232;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        transition:
          background 0.2s ease,
          transform 0.15s ease;
      }

      .omikuji-controls button:hover {
        background: #8a2828;
        transform: translateY(-2px);
      }

      #reset-button {
        background: #6b5a52;
      }

      #reset-button:hover {
        background: #55453f;
      }

      #money {
        background: #c9a15a;
        color: #3a2e2a;
        font-weight: bold;
      }

      #money:hover {
        background: #b78f4a;
      }

      .historyBox {
        max-width: 50px;
        margin: 24px auto;
        padding: 2px 30px;
        font-weight: bold;
        text-align: center;
        background: #fffaf0;
        color: #a83232;
        border: 2px solid #c9a15a;
        border-radius: 4px;
        box-shadow: 0 4px 12px rgba(168, 50, 50, 0.15);
        position: relative;
      }

      .historyBox::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid #c9a15a;
        border-radius: 2px;
        pointer-events: none;
      }

      .omikuji-remaining {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
      }

      .omikuji-history {
        margin-top: 12px;
        padding: 0;
        list-style: none;
        text-align: center;
        font-size: 14px;
      }

      #historyTitle {
        font-size: 17px;
        border-bottom: 1px solid #c9a15a;
      }

      .omikuji-history li {
        padding: 4px 0;
        border-bottom: 1px dashed #e2d2b4;
      }

      .omikuji-history li:last-child {
        border-bottom: none;
      }
    </style>
  </head>

  <body>
    <h1>おみくじアプリ</h1>
    <p>「おみくじを引く」ボタンを押してみましょう。</p>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリックrest.textContent時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <button id="draw-button">おみくじを引く</button>
      <button id="reset-button">リセット</button>
      <button id="money">賞金がここに出ます</button>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->
    <div id="remaining" class="omikuji-remaining"></div>
    <div class="historyBox">
      <p id="historyTitle">履歴</p>
      <ul id="history" class="omikuji-history"></ul>
    </div>
    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
